<script>
    // Telegram WebApp Initialization
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // User Data Extraction (With Fallback)
    const tgUser = tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
    const userId = tgUser && tgUser.id ? tgUser.id.toString() : "guest_user";
    
    // Telegram First Name + Last Name Extract
    let userName = "Guest User";
    if (tgUser) {
        const firstName = tgUser.first_name || "";
        const lastName = tgUser.last_name || "";
        userName = (firstName + " " + lastName).trim() || tgUser.username || "Telegram User";
    }

    // Firebase Config
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "telegram-earn-app-bf23c.firebaseapp.com",
        databaseURL: "https://telegram-earn-app-bf23c-default-rtdb.firebaseio.com",
        projectId: "telegram-earn-app-bf23c",
        storageBucket: "telegram-earn-app-bf23c.appspot.com",
        messagingSenderId: "314288083027",
        appId: "1:314288083027:web:6bc9fec573...",
        measurementId: "G-FLS411DZE3"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const today = new Date().toISOString().slice(0, 10);
    const userRef = db.ref('users/' + userId);
    let currentBalance = 0;
    let todayCount = 0;
    let isWatchingAd = false;
    let timerInterval = null;

    // Firebase Sync & Auto Update User Info
    userRef.on('value', (snapshot) => {
        const data = snapshot.val();
        
        if (!data) {
            // New User First Time Creation
            userRef.set({
                balance: 0,
                lastDate: today,
                todayCount: 0,
                name: userName
            });
            return;
        }

        // Existing User Updates
        todayCount = data.todayCount || 0;
        currentBalance = data.balance || 0;

        let updatePayload = {};

        // Update name if missing or changed
        if (!data.name || (data.name === "Guest User" && userName !== "Guest User")) {
            updatePayload.name = userName;
        }

        // Reset Daily Count on New Day
        if (data.lastDate !== today) {
            todayCount = 0;
            updatePayload.lastDate = today;
            updatePayload.todayCount = 0;
        }

        if (Object.keys(updatePayload).length > 0) {
            userRef.update(updatePayload);
        }

        document.getElementById('balance').innerText = currentBalance;
        document.getElementById('watchedCount').innerText = todayCount;

        if (todayCount >= 30) {
            document.getElementById('adBtn').disabled = true;
            document.getElementById('status').innerText = "আজকের ভিডিও সীমা (৩০টি) শেষ! আগামীকাল আবার চেষ্টা করুন।";
            document.getElementById('status').style.color = "#ff5252";
        }
    });

    // Load Withdrawal History
    db.ref('withdrawals').orderByChild('userId').equalTo(userId).on('value', (snapshot) => {
        const historyList = document.getElementById('historyList');
        historyList.innerHTML = '';

        if (snapshot.exists()) {
            snapshot.forEach((childSnapshot) => {
                const item = childSnapshot.val();
                const statusClass = item.status === 'successful' ? 'status-successful' : 'status-processing';
                const statusText = item.status === 'successful' ? 'Successful' : 'Processing';

                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div>
                        <b>${item.amount}</b> (${item.method})<br>
                        <span style="font-size:11px; color:#aaa;">${item.timestamp}</span>
                    </div>
                    <div class="${statusClass}">${statusText}</div>
                `;
                historyList.appendChild(div);
            });
        } else {
            historyList.innerHTML = '<p class="info-text">কোনো উইথড্র হিস্টোরি নেই</p>';
        }
    });

    // Watch Ad Logic with 30-Second Timer
    function watchAd() {
        if (todayCount >= 30) {
            alert("আজকের ভিডিও সীমা শেষ!");
            return;
        }

        const nextVideoNo = todayCount + 1;
        alert(`${nextVideoNo} নম্বর ভিডিও প্রসেস করা হচ্ছে।`);

        const statusElem = document.getElementById('status');
        const timerBox = document.getElementById('timerBox');
        const countdownElem = document.getElementById('countdown');
        const adBtn = document.getElementById('adBtn');

        const showAd = window.show_11866445 || window.show || (window.monetag && window.monetag.show);

        if (typeof showAd === 'function') {
            showAd();
        } else if (typeof show_11866445 !== 'undefined') {
            show_11866445();
        }

        isWatchingAd = true;
        adBtn.disabled = true;
        timerBox.style.display = "block";
        statusElem.innerText = `${nextVideoNo} নম্বর ভিডিও চালু হয়েছে, পুরো ৩০ সেকেন্ড দেখুন...`;
        statusElem.style.color = "#ffeb3b";

        let timeLeft = 30;
        countdownElem.innerText = timeLeft;

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            countdownElem.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerBox.style.display = "none";
                isWatchingAd = false;
                adBtn.disabled = false;
                addRewardPoints();
            }
        }, 1000);
    }

    // Cancel on Minimize
    document.addEventListener("visibilitychange", function() {
        if (document.hidden && isWatchingAd) {
            clearInterval(timerInterval);
            isWatchingAd = false;
            document.getElementById('timerBox').style.display = "none";
            document.getElementById('adBtn').disabled = false;
            
            const statusElem = document.getElementById('status');
            statusElem.innerText = "আপনি ৩০ সেকেন্ডের আগে ব্যাক করেছেন! পয়েন্ট পেতে ভিডিওটি পুরো দেখুন।";
            statusElem.style.color = "#ff5252";
        }
    });

    // Reward Point Calculation
    function addRewardPoints() {
        const statusElem = document.getElementById('status');
        userRef.once('value').then((snapshot) => {
            const data = snapshot.val() || { balance: 0, todayCount: 0 };
            const newBalance = (data.balance || 0) + 10;
            const newCount = (data.todayCount || 0) + 1;

            userRef.update({
                balance: newBalance,
                todayCount: newCount,
                lastDate: today,
                name: userName
            });

            statusElem.innerText = "অভিনন্দন! ১০ পয়েন্ট সফলভাবে যোগ করা হয়েছে।";
            statusElem.style.color = "#00e676";
        });
    }

    // Withdraw Logic
    function requestWithdraw() {
        const method = document.getElementById('paymentMethod').value;
        const account = document.getElementById('accountNumber').value.trim();
        const points = parseInt(document.getElementById('withdrawPoints').value);
        const wStatus = document.getElementById('withdrawStatus');

        if (!account) {
            wStatus.innerText = "দয়া করে সঠিক নম্বর বা UPI ID লিখুন।";
            wStatus.style.color = "#ff5252";
            return;
        }

        if (isNaN(points) || points < 1000) {
            wStatus.innerText = "সর্বনিম্ন ১০০০ পয়েন্ট উইথড্র করতে হবে।";
            wStatus.style.color = "#ff5252";
            return;
        }

        if (points > currentBalance) {
            wStatus.innerText = "আপনার কাছে পর্যাপ্ত পয়েন্ট নেই!";
            wStatus.style.color = "#ff5252";
            return;
        }

        wStatus.innerText = "প্রসেসিং হচ্ছে...";
        wStatus.style.color = "#ffeb3b";

        const newBalance = currentBalance - points;
        const currency = method.includes('INR') ? 'INR (₹)' : 'BDT (৳)';
        const calculatedAmount = (points / 100).toFixed(2);

        userRef.update({ balance: newBalance }).then(() => {
            const withdrawRef = db.ref('withdrawals').push();
            withdrawRef.set({
                userId: userId,
                userName: userName,
                method: method,
                account: account,
                points: points,
                amount: calculatedAmount + ' ' + currency,
                status: 'processing',
                timestamp: new Date().toLocaleDateString()
            }).then(() => {
                wStatus.innerText = "উইথড্র রিকোয়েস্ট জমা হয়েছে!";
                wStatus.style.color = "#00e676";
                document.getElementById('accountNumber').value = '';
                document.getElementById('withdrawPoints').value = '';
            });
        }).catch((err) => {
            wStatus.innerText = "সমস্যা হয়েছে, পরে আবার চেষ্টা করুন।";
            wStatus.style.color = "#ff5252";
        });
    }
</script>
