<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earn Money App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e293b;
      color: #ffffff;
      margin: 0;
      padding: 15px;
    }
    .card {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
    }
    .btn {
      background-color: #10b981;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      font-weight: bold;
    }
    .btn:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
    .status-box {
      background-color: #1e293b;
      border-radius: 8px;
      padding: 10px;
      margin-top: 15px;
      color: #fbbf24;
      font-weight: bold;
    }
    .alert-msg {
      color: #34d399;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- ভিডিও দিয়ে পয়েন্ট আয় কার্ড -->
  <div class="card">
    <h2>🎬 ভিডিও দেখুন এবং পয়েন্ট আয় করুন</h2>
    <p>মোট ব্যালেন্স: <span id="user-points">150</span> পয়েন্ট</p>
    <p>আজকে দেখা হয়েছে: <span id="ads-watched">5</span> / 100</p>

    <button id="ad-btn" class="btn" onclick="openAdAndStartTimer()">ভিডিও অ্যাড দেখুন</button>

    <div id="status-container" class="status-box" style="display: none;">
      <span id="timer-text">অপেক্ষা করুন: 30 সেকেন্ড</span>
    </div>

    <div id="success-msg" class="alert-msg">
      অভিনন্দন! ১০ পয়েন্ট সফলভাবে যোগ করা হয়েছে!
    </div>
  </div>

  <script>
    let points = 150;
    let watchedCount = 5;
    let timeLeft = 30;
    let countdownTimer = null;
    let isTimerRunning = false;

    const adBtn = document.getElementById('ad-btn');
    const statusContainer = document.getElementById('status-container');
    const timerText = document.getElementById('timer-text');
    const successMsg = document.getElementById('success-msg');
    const userPoints = document.getElementById('user-points');
    const adsWatched = document.getElementById('ads-watched');

    // অ্যাড ক্লিক করলে চালু হবে
    function openAdAndStartTimer() {
      // ১. অ্যাড লিংক অন্য ট্যাবে ওপেন করা
      window.open('https://your-ad-link.com', '_blank');

      // ২. টাইমার সেটআপ
      timeLeft = 30;
      adBtn.disabled = true;
      successMsg.style.display = 'none';
      statusContainer.style.display = 'block';
      timerText.innerText = `অপেক্ষা করুন: ${timeLeft} সেকেন্ড`;

      startTimer();
    }

    // টাইমার চালু করার ফাংশন
    function startTimer() {
      if (isTimerRunning) return;
      
      isTimerRunning = true;
      countdownTimer = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          timerText.innerText = `অপেক্ষা করুন: ${timeLeft} সেকেন্ড`;
        } else {
          // টাইমার শেষ হলে পয়েন্ট দেওয়া হবে
          clearInterval(countdownTimer);
          isTimerRunning = false;
          rewardUser();
        }
      }, 1000);
    }

    // টাইমার পজ করার ফাংশন
    function pauseTimer() {
      clearInterval(countdownTimer);
      isTimerRunning = false;
    }

    // পেজ ভিজিবিলিটি ট্র্যাকিং (ইউজার অ্যাপ থেকে বের হলে থামবে)
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        // ইউজার অ্যাপ মিনিমাইজ করলে বা অন্য লিংকে গেলে টাইমার থেমে যাবে
        if (isTimerRunning) {
          pauseTimer();
          timerText.innerText = `পজ হয়ে আছে (${timeLeft} সেকেন্ড বাকি) - অ্যাপে ফিরে আসুন`;
        }
      } else {
        // ইউজার অ্যাপে ফিরে এলে আবার সময় চালু হবে
        if (!isTimerRunning && timeLeft > 0 && adBtn.disabled) {
          timerText.innerText = `অপেক্ষা করুন: ${timeLeft} সেকেন্ড`;
          startTimer();
        }
      }
    });

    // রিওয়ার্ড যোগ করা
    function rewardUser() {
      points += 10;
      watchedCount += 1;

      userPoints.innerText = points;
      adsWatched.innerText = watchedCount;

      statusContainer.style.display = 'none';
      successMsg.style.display = 'block';
      adBtn.disabled = false;
    }
  </script>

</body>
</html>
